---
layout: default
title: Basket
description: Review selected Money From The Future canvas designs and checkout with PayPal.
permalink: /investment-art/basket.html
footer_title: Basket
---
<main class="checkout-page">
  <section class="shell checkout-head">
    <div class="checkout-head-titles">
      <span class="art-badge">Basket</span>
      <h1>Your basket</h1>
    </div>
    <a class="button button-secondary" href="{{ '/' | relative_url }}#catalog">Add more designs</a>
  </section>

  <section class="shell basket-section">
    <div class="basket-layout">
      <div class="basket-panel reveal">
        <div id="basket-items" class="basket-items"></div>
        <div class="basket-total">
          <span id="basket-summary">0 prints in basket</span>
          <strong id="basket-total">USD 0</strong>
        </div>
        <button class="basket-clear-link" type="button" id="clear-basket">Clear basket</button>
      </div>

      <aside class="checkout-card reveal delay-1">
        <div id="checkout-flow" class="checkout-flow">
          <p class="checkout-form-label">Checkout</p>
          <p class="checkout-hint">Pay securely with PayPal or card.</p>
          <form
            id="order-form"
            action="https://formspree.io/f/mzdqwgby"
            method="POST"
          >
            <!-- Delivery details are captured from PayPal after payment, then forwarded here. -->
            <input id="name" name="name" type="hidden" value="">
            <input id="email" name="email" type="hidden" value="">
            <input id="street-address" name="street-address" type="hidden" value="">
            <input id="city" name="city" type="hidden" value="">
            <input id="postcode" name="postcode" type="hidden" value="">
            <input id="country" name="country" type="hidden" value="">
            <input id="form-subject" name="_subject" type="hidden" value="Money From The Future order">
            <input id="basket-summary-field" name="basket_summary" type="hidden" value="">
            <input id="basket-total-field" name="basket_total" type="hidden" value="">
            <input id="payment-status-field" name="payment_status" type="hidden" value="Paid via PayPal">
            <input id="source-page-field" name="source_page" type="hidden" value="basket">
            <textarea id="basket-lines-field" name="basket_lines" hidden></textarea>
            <textarea id="form-message" name="message" hidden></textarea>
            <div class="checkout-actions">
              <div
                id="paypal-button-container"
                class="paypal-smart-buttons"
                data-paypal-client-id="{{ site.paypal_client_id | escape }}"
              ></div>
              <p id="paypal-button-status" class="checkout-note"></p>
            </div>
          </form>
        </div>
        <div id="payment-success-host" hidden></div>
        <template id="payment-success-template">
          <section class="payment-success-screen" aria-live="polite">
            <span class="eyebrow checkout-eyebrow">Payment Received</span>
            <h2>Payment Successful.</h2>
            <div class="payment-success-card">
              <div class="payment-success-row">
                <span>Order</span>
                <strong data-success-summary></strong>
              </div>
              <div data-success-lines class="payment-success-lines"></div>
              <div class="payment-success-row payment-success-total">
                <span>Total</span>
                <strong data-success-total></strong>
              </div>
            </div>
            <p class="payment-success-ship" data-success-ship hidden></p>
            <p class="checkout-note" data-order-status aria-live="polite"></p>
            <div class="payment-success-actions">
              <a class="button button-secondary" href="{{ '/' | relative_url }}">Keep browsing</a>
            </div>
          </section>
        </template>
      </aside>
    </div>
  </section>
</main>
