      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: artworks
    values:
      layout: artwork
      price: 100
      format: Canvas Print

exclude:
  - Gemfile
  - Gemfile.lock
  - readme-developer.md
  - changelog-promptlog.md
  - generate-investment-art.mjs
  - vendor
  - node_modules
