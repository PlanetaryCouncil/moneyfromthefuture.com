# Newsletter / contact form endpoint. Reuses the order Formspree form for now
# (submissions are tagged source=newsletter); swap to a dedicated form when ready.
newsletter_form_url: "https://formspree.io/f/mzdqwgby"

collections:
  artworks:
    output: true
    sort_by: order
    permalink: /investment-art/:name.html

defaults:
