<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{ --bone:#F4F1EA; --ink:#111315; --line:#cdc7b8; --label:#6f6a5d; --hot:#e23b2e; }
  *{box-sizing:border-box}
  #ppc-wrap{ font-family:"Arial Narrow","Helvetica Neue Condensed",Helvetica,Arial,sans-serif;
    background:var(--bone); color:var(--ink); border:1px solid var(--line); max-width:1040px; margin:0 auto; }
  #ppc-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:18px 22px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #ppc-head .eyebrow{ font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--label); font-weight:700; }
  #ppc-head h2{ margin:4px 0 0; font-size:clamp(26px,5vw,46px); line-height:.92; font-weight:800;
    letter-spacing:-.01em; text-transform:uppercase; font-stretch:condensed; }
  #ppc-head .spec{ font-size:13px; letter-spacing:.04em; color:var(--label); text-align:right; min-width:160px; }
  #ppc-stage{ position:relative; width:100%; aspect-ratio:16/10; min-height:340px; background:#0c0d11;
    cursor:grab; touch-action:none; overflow:hidden; }
  #ppc-stage.grabbing{cursor:grabbing}
  #ppc-stage canvas{display:block; width:100%!important; height:100%!important}
  #ppc-hint{ position:absolute; left:0; right:0; bottom:12px; text-align:center; font-size:11px;
    letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.42); pointer-events:none;
    transition:opacity .5s; font-weight:700; }
  #ppc-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:14px 22px; border-top:1px solid var(--line); }
  .ctl-label{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--label); font-weight:700; margin-right:2px; }
  .ppc-btn{ font:inherit; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    padding:8px 14px; cursor:pointer; background:transparent; color:var(--ink); border:1px solid var(--ink); line-height:1; }
  .ppc-btn:hover{background:var(--ink); color:var(--bone)}
  .ppc-btn:focus-visible{outline:2px solid var(--hot); outline-offset:2px}
  .ppc-btn.active{background:var(--ink); color:var(--bone)}
  .ppc-spacer{flex:1}
  #ppc-reset{border-color:var(--line); color:var(--label)}
  #ppc-reset:hover{background:var(--label); color:var(--bone); border-color:var(--label)}
  @media (max-width:560px){ #ppc-head .spec{text-align:left; min-width:0} .ppc-spacer{display:none; flex-basis:100%} }
</style>

<div id="ppc-wrap">
  <div id="ppc-head">
    <div>

      <h2>Peace Planetary Council</h2>

    <div id="ppc-hint">Scroll to zoom · drag to rotate & pan</div>
  </div>
</div>

  const stage = document.getElementById('ppc-stage');
  const hint  = document.getElementById('ppc-hint');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  function gradientTexture(top,bottom){
    const c=document.createElement('canvas'); c.width=4; c.height=256;
    const ctx=c.getContext('2d'); const g=ctx.createLinearGradient(0,0,0,256);
    g.addColorStop(0,top); g.addColorStop(1,bottom); ctx.fillStyle=g; ctx.fillRect(0,0,4,256);
    const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
  }
  const bgDark = gradientTexture('#15151b','#23232c');
  const bgLite = gradientTexture('#d4d8dc','#e8eaec');
  scene.background = bgDark;

  const camera = new THREE.PerspectiveCamera(38, 16/10, 0.03, 100);

  // ---- wall ----
  const wallMat = new THREE.MeshStandardMaterial({color:0x9c6b54, roughness:0.96});
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(22,14), wallMat);
  wall.position.z = -0.07; wall.receiveShadow = true; scene.add(wall);

  // ---- lights ----
  const ambient = new THREE.AmbientLight(0xc2ccdc, 0.40); scene.add(ambient);
  const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x40342a, 0.32); scene.add(hemi);

  const key = new THREE.DirectionalLight(0xfff1de, 1.05);
  key.position.set(-2.6,3.2,3.0); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.near=0.5; key.shadow.camera.far=14;
  key.shadow.camera.left=-3.5; key.shadow.camera.right=3.5;
  key.shadow.camera.top=3.5; key.shadow.camera.bottom=-3.5;
  key.shadow.radius=5; key.shadow.bias=-0.0006; scene.add(key);

  const spot = new THREE.SpotLight(0xfff0d8, 1.35, 12, 0.55, 0.7, 1.1);
  spot.position.set(0,2.4,1.6); scene.add(spot);

  // ---- artwork ----
  const ASPECT=2.0, W=2.0, H=W/ASPECT, D=0.06;
  const C = new THREE.Vector3(0,0,0);          // canvas centre = orbit/pan focus
  const art = new THREE.Group(); art.position.copy(C); scene.add(art);
  spot.target = art; scene.add(spot.target);

  const loader = new THREE.TextureLoader();
  loader.load(TEX, function(front){
    front.encoding=THREE.sRGBEncoding;
    front.anisotropy=renderer.capabilities.getMaxAnisotropy();
    const frontMat=new THREE.MeshStandardMaterial({map:front, emissiveMap:front,
      emissive:0xffffff, emissiveIntensity:0.22, roughness:0.82, metalness:0});
    const sideMat=new THREE.MeshBasicMaterial({color:0x0f1218});   // unlit, never white
    const backMat=new THREE.MeshStandardMaterial({color:0x0c0c0e, roughness:1});
    const boxArt=new THREE.Mesh(new THREE.BoxGeometry(W,H,D),
      [sideMat,sideMat,sideMat,sideMat,frontMat,backMat]);
    boxArt.castShadow=true; art.add(boxArt);

    // soft colored glow onto the wall (wall right behind -> no edge peek)
    const small=document.createElement('canvas'); small.width=48; small.height=24;
    const img=new Image();
    img.onload=function(){
      small.getContext('2d').drawImage(img,0,0,48,24);
      const big=document.createElement('canvas'); big.width=256; big.height=128;
      const bc=big.getContext('2d'); bc.filter='blur(10px)'; bc.drawImage(small,0,0,256,128);
      const halo=new THREE.CanvasTexture(big); halo.encoding=THREE.sRGBEncoding;
      const hm=new THREE.Mesh(new THREE.PlaneGeometry(W*1.7,H*1.9),
        new THREE.MeshBasicMaterial({map:halo, transparent:true, opacity:0.30,
          blending:THREE.AdditiveBlending, depthWrite:false}));
      hm.position.set(0,0,-0.05); art.add(hm);
    };
    img.src=TEX;
  });

  // ---- controls ----
  const ctrl={ az:0, pol:0.05, dist:3.4, tAz:0, tPol:0.05, tDist:3.4,
    panX:0, panY:0, tPanX:0, tPanY:0, auto:!reduce, lastInput:0, dragging:false, px:0, py:0 };
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function point(e){ if(e.touches&&e.touches[0]) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
    return {x:e.clientX,y:e.clientY}; }
  const PAN_AT = 2.0;   // below this distance, drag pans across the art

  stage.addEventListener('pointerdown',e=>{ ctrl.dragging=true; ctrl.lastInput=performance.now();
    stage.classList.add('grabbing'); const p=point(e); ctrl.px=p.x; ctrl.py=p.y; hint.style.opacity='0'; });
  window.addEventListener('pointermove',e=>{ if(!ctrl.dragging)return; const p=point(e);
    const dx=p.x-ctrl.px, dy=p.y-ctrl.py;
    if(ctrl.dist<PAN_AT){ const k=ctrl.dist*0.0016;
      ctrl.tPanX=clamp(ctrl.tPanX-dx*k,-W/2,W/2);
      ctrl.tPanY=clamp(ctrl.tPanY+dy*k,-H/2,H/2);
    } else { ctrl.tAz=clamp(ctrl.tAz+dx*0.005,-0.62,0.62);
      ctrl.tPol=clamp(ctrl.tPol-dy*0.004,-0.34,0.34); }
    ctrl.px=p.x; ctrl.py=p.y; ctrl.lastInput=performance.now(); });
  window.addEventListener('pointerup',()=>{ ctrl.dragging=false; ctrl.lastInput=performance.now();
    stage.classList.remove('grabbing'); });
  stage.addEventListener('wheel',e=>{ e.preventDefault();
    ctrl.tDist=clamp(ctrl.tDist+e.deltaY*0.003,0.45,6.5); ctrl.lastInput=performance.now(); },{passive:false});
  let pinch=0;
  stage.addEventListener('touchmove',e=>{ if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.hypot(dx,dy); if(pinch) ctrl.tDist=clamp(ctrl.tDist+(pinch-d)*0.008,0.45,6.5);
    pinch=d; ctrl.lastInput=performance.now(); e.preventDefault(); } },{passive:false});
  stage.addEventListener('touchend',()=>pinch=0);
  stage.addEventListener('keydown',e=>{ const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];
    if(!d)return;
    if(ctrl.dist<PAN_AT){ ctrl.tPanX=clamp(ctrl.tPanX+d[0]*0.07,-W/2,W/2); ctrl.tPanY=clamp(ctrl.tPanY+d[1]*0.05,-H/2,H/2); }
    else { ctrl.tAz=clamp(ctrl.tAz+d[0]*0.08,-0.62,0.62); ctrl.tPol=clamp(ctrl.tPol+d[1]*0.06,-0.34,0.34); }
    ctrl.lastInput=performance.now(); e.preventDefault(); });

  function resize(){ const w=stage.clientWidth,h=stage.clientHeight;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  window.addEventListener('resize',resize); resize();

  const clock=new THREE.Clock();
  (function animate(){
    requestAnimationFrame(animate);
    const t=clock.getElapsedTime();
    if(!reduce){
      const idle=performance.now()-ctrl.lastInput;
      if(!ctrl.dragging&&idle>2600) ctrl.auto=true; if(ctrl.dragging) ctrl.auto=false;
      if(ctrl.auto && ctrl.dist>2.4){ ctrl.tAz=Math.sin(t*0.11)*0.34; ctrl.tPol=0.05+Math.sin(t*0.07)*0.05; }
    }
    if(ctrl.dist<PAN_AT && !ctrl.dragging){ ctrl.tAz+=(0-ctrl.tAz)*0.05; ctrl.tPol+=(0.02-ctrl.tPol)*0.05; } // square up to inspect
    ctrl.az+=(ctrl.tAz-ctrl.az)*0.06; ctrl.pol+=(ctrl.tPol-ctrl.pol)*0.06; ctrl.dist+=(ctrl.tDist-ctrl.dist)*0.08;
    ctrl.panX+=(ctrl.tPanX-ctrl.panX)*0.12; ctrl.panY+=(ctrl.tPanY-ctrl.panY)*0.12;
    const fx=C.x+ctrl.panX, fy=C.y+ctrl.panY, fz=C.z;
    camera.position.set(
      fx+Math.sin(ctrl.az)*Math.cos(ctrl.pol)*ctrl.dist,
      fy+Math.sin(ctrl.pol)*ctrl.dist,
      fz+Math.cos(ctrl.az)*Math.cos(ctrl.pol)*ctrl.dist);
    camera.lookAt(fx,fy,fz);
    renderer.render(scene,camera);
  })();
})();
