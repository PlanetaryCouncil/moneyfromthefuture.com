<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} Canvas Shop{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/shop.css' | relative_url }}">
</head>
<body>
  <header class="shell">
    <div class="topbar">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">MF</span>
        <span>{{ site.title }}</span>
      </a>
      <nav>
        <a href="{{ '/' | relative_url }}">All Works</a>
        <a href="{{ '/about.html' | relative_url }}">About Us</a>
        <a href="{{ '/policies.html' | relative_url }}">Policies</a>
        <a href="{{ '/social.html' | relative_url }}">Social</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/investment-art/basket.html' | relative_url }}">Basket <span data-basket-count>0</span></a>
      </nav>
    </div>
  </header>
  {{ content }}
  <footer class="shell">
    <div class="footer-bar">
      <span>{{ page.footer_title | default: page.title | default: site.title }}</span>
      <span>Canvas only. EUR 100. One design per family.</span>
    </div>
  </footer>
  <script id="artwork-catalog-data" type="application/json">
    [
      {% assign catalog_artworks = site.artworks | sort: 'order' %}
      {% for artwork in catalog_artworks %}
      {% assign basket_image = artwork.preview_image | default: artwork.image %}
      {
        "id": {{ artwork.art_id | jsonify }},
        "slug": {{ artwork.slug | jsonify }},
        "title": {{ artwork.title | jsonify }},
        "image": {{ '/images/' | append: basket_image | relative_url | jsonify }},
        "price": {{ artwork.price | default: 100 | jsonify }}
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  </script>
  <script src="{{ '/shop.js' | relative_url }}"></script>
</body>
</html>
