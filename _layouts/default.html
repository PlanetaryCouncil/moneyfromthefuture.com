<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} Canvas Shop{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/shop.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="shell topbar">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">MFTF</span>
        <span>{{ site.title }}</span>
      </a>
      <nav>
        <a href="{{ '/' | relative_url }}">All Works</a>
        <a href="{{ '/about.html' | relative_url }}">About Us</a>
        <a href="{{ '/policies.html' | relative_url }}">Policies</a>
        <a href="{{ '/social.html' | relative_url }}">Social</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a class="basket-nav-link" href="{{ '/investment-art/basket.html' | relative_url }}" aria-label="Shopping cart">
          <span class="basket-nav-icon" aria-hidden="true">🛒</span>
          <span data-basket-count>0</span>
        </a>
      </nav>
    </div>
  </header>
  {{ content }}
  <footer class="shell">
    <div class="footer-bar">
      <span>{{ page.footer_title | default: page.title | default: site.title }}</span>
      <span>Canvas only. EUR 100. One design per family.</span>
    </div>
  </footer>
  <script src="{{ '/shop.js' | relative_url }}"></script>
</body>
</html>
