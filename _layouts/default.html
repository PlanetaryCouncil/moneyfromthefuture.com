<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} Canvas Shop{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/investment-art/shop.css' | relative_url }}">
</head>
<body>
  <header class="shell">
    <div class="topbar">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">MF</span>
        <span>{{ site.title }}</span>
      </a>
      <nav>
        <a href="{{ '/' | relative_url }}">All Works</a>
        <a href="{{ '/investment-art/basket.html' | relative_url }}">Basket <span data-basket-count>0</span></a>
      </nav>
    </div>
  </header>
  {{ content }}
  <footer class="shell">
    <div class="footer-bar">
      <span>{{ page.footer_title | default: page.title | default: site.title }}</span>
      <span>Canvas only. EUR 100. One design per family.</span>
    </div>
  </footer>
  <script src="{{ '/investment-art/shop.js' | relative_url }}"></script>
</body>
</html>
