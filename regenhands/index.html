  <style>
    :root {
      --bg:        #000000;
      --ink:       #eafff0;
      --ink-soft:  #8fae98;
      --green:     #3fd96b;
      --green-deep:#1f8f43;
      --gold:      #f5c542;
      --gold-soft: #c79a2e;
      --line:      rgba(63, 217, 107, 0.20);

      --font-sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 22px 36px;
      overflow-x: hidden;
    }

    main { width: 100%; max-width: 540px; text-align: center; }

    /* ── The visual: the logo is the hero ───────────────────────────── */
    .hero-art {
      display: block;
      width: clamp(280px, 72vw, 500px);
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 0 60px rgba(63, 217, 107, 0.28));
      animation: float 8s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    .tagline {
      margin-top: 6px;
      font-size: 0.74rem;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: var(--gold);
    }

    /* ── Email capture ──────────────────────────────────────────────── */
    form {
      margin-top: 30px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    input[type="email"] {
      flex: 1 1 240px;
      min-width: 0;
      padding: 16px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(20, 40, 28, 0.45);
      color: var(--ink);
      font: 1rem var(--font-sans);
      outline: none;
      transition: border-color 0.2s ease;
    }
    input[type="email"]::placeholder { color: rgba(143, 174, 152, 0.7); }
    input[type="email"]:focus { border-color: var(--green); }

    button {
      flex: 0 0 auto;
      padding: 16px 28px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font: 600 1rem var(--font-sans);
      color: #04130a;
      background: linear-gradient(120deg, var(--green), var(--green-deep));
      box-shadow: 0 12px 30px rgba(63, 217, 107, 0.3);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(63, 217, 107, 0.42); }
    button:disabled { opacity: 0.6; cursor: default; transform: none; }

    .error { color: #ff9a8a; margin-top: 12px; font-size: 0.88rem; min-height: 1.1em; }

    /* ── Success state ──────────────────────────────────────────────── */
    .success { display: none; }
    .success.show { display: block; animation: fade 0.6s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .id-card {
      margin: 28px auto 0;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(20, 40, 28, 0.4);
      max-width: 360px;
    }
    .id-card .label {
      font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold);
    }
    .id-card .id {
      font-family: var(--font-serif);
      font-size: 1.8rem; letter-spacing: 0.12em; margin-top: 8px; word-break: break-all;
    }
    .karma { margin-top: 22px; font-size: 0.98rem; color: var(--ink-soft); }
    .karma b { color: var(--green); font-weight: 700; }

    /* ── Bottom: creator + projects (compact) ───────────────────────── */
    .footer-zone {
      width: 100%; max-width: 540px;
      margin-top: 46px; padding-top: 26px;
      border-top: 1px solid var(--line);
      text-align: center;
    }
    .eyebrow { font-size: 0.68rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); }
    .creator { font-family: var(--font-serif); font-size: 1.15rem; margin-top: 6px; }

    .icon-row { margin-top: 16px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .icon-row a {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border-radius: 50%;
      border: 1px solid var(--line);
      color: var(--ink-soft);
      transition: transform 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    }
    .icon-row a:hover { transform: translateY(-3px); color: var(--gold); border-color: var(--gold-soft); }
    .icon-row svg { width: 18px; height: 18px; }

    .projects { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 10px; justify-content: center; }
    .projects a {
      font-size: 0.8rem; color: var(--ink-soft);
      padding: 6px 13px; border-radius: 999px; border: 1px solid var(--line);
      transition: color 0.16s ease, border-color 0.16s ease;
    }
    .projects a:hover { color: var(--gold); border-color: var(--gold-soft); }

    @media (prefers-reduced-motion: reduce) {
      .hero-art, .success.show { animation: none; }
    }
  </style>

  <script>
    // ── Email capture: paste a Google Form pre-filled link to collect ──
    // (⋮ menu → "Get pre-filled link" → fill the field → copy → paste here)
    // Leave empty for local-only mode (shows the ID, does not collect).
    const GOOGLE_FORM_PREFILL_LINK = "";

    function parseGoogleForm(link) {
      try {
        const u = new URL(link);
        const action = u.origin + u.pathname.replace('/viewform', '/formResponse');
        for (const [key] of u.searchParams) {
          if (key.startsWith('entry.')) return { action, field: key };
        }
      } catch (_) {}
      return null;
    }
    const FORM = GOOGLE_FORM_PREFILL_LINK ? parseGoogleForm(GOOGLE_FORM_PREFILL_LINK) : null;

    const form = document.getElementById('join-form');
    const emailEl = document.getElementById('email');
    const errEl = document.getElementById('error');
    const btn = document.getElementById('submit-btn');

    // Stable ID from the email, so revisits show the same one.
    function makeId(email) {
      let h = 0;
      for (let i = 0; i < email.length; i++) h = (h * 31 + email.charCodeAt(i)) >>> 0;
      return 'RH-' + h.toString(36).toUpperCase().padStart(6, '0').slice(-6);
    }

    function showSuccess(id) {
      document.getElementById('unique-id').textContent = id;
      document.getElementById('signup').style.display = 'none';
      document.getElementById('success').classList.add('show');
    }

    const prior = localStorage.getItem('regenhands_email');
    if (prior) showSuccess(makeId(prior));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.textContent = '';
      const email = emailEl.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        errEl.textContent = 'Please enter a valid email address.';
        return;
      }
      btn.disabled = true;
      btn.textContent = '…';
      try {
        if (FORM) {
          const body = new URLSearchParams();
          body.append(FORM.field, email);
          await fetch(FORM.action, { method: 'POST', mode: 'no-cors', body });
        }
        localStorage.setItem('regenhands_email', email);
        showSuccess(makeId(email));
      } catch (err) {
        errEl.textContent = 'Something went wrong — please try again.';
        btn.disabled = false;
        btn.textContent = 'Join →';
      }
    });
  </script>
